    const ns=[];segs.forEach(([s,e])=>{if(p1<=s||p0>=e){ns.push([s,e]);return;} if(p0>s)ns.push([s,p0]); if(p1<e)ns.push([p1,e]); if(!d.open)lint.push([Math.max(s,p0),Math.min(e,p1)]);}); segs=ns;});
  return {segs,lint};}
M.rooms.forEach(r=>{const deck=r.type==='deck',h=deck?1:H,t=deck?.08:T,col=deck?0x9a9489:0xf3f1ec;
  [['x',r.x-t,r.x+r.w+t,r.y-t,r.y],['x',r.x-t,r.x+r.w+t,r.y+r.d,r.y+r.d+t],['z',r.y,r.y+r.d,r.x-t,r.x],['z',r.y,r.y+r.d,r.x+r.w,r.x+r.w+t]].forEach(([ax,a0,a1,c0,c1])=>{
    const {segs,lint}=cut(a0,a1,ax,c0,c1);
    segs.forEach(([s,e])=>{const w=ax==='x'?box(s,c0,e,c1,0,h,col):box(c0,s,c1,e,0,h,col); w.userData.h=h; walls.push(w);});
    if(!deck) lint.forEach(([s,e])=>{const w=ax==='x'?box(s,c0,e,c1,2.1,H,col):box(c0,s,c1,e,2.1,H,col); w.userData.lint=1; walls.push(w);});});});
function fur(f){const c=new THREE.Color(f.c),x0=f.x,z0=f.y,x1=f.x+f.w,z1=f.y+f.d;
  if(f.kind==='bed_left'){box(x0,z0,x1,z1,0,.3,0x6b5644);box(x0+.05,z0+.05,x1-.02,z1-.05,.3,.5,c);box(x0,z0,x0+.08,z1,0,1,0x6b5644);box(x0+.12,z0+.12,x0+.45,z1-.12,.5,.62,0xffffff);return;}
  if(f.kind.startsWith('sofa')){box(x0,z0,x1,z1,0,.42,c);const bz=f.kind==='sofa_up'?[z1-.25,z1]:[z0,z0+.25];
    box(x0,bz[0],x1,bz[1],.42,.85,c.clone().multiplyScalar(.85));box(x0,z0,x0+.18,z1,.42,.62,c);box(x1-.18,z0,x1,z1,.42,.62,c);return;}
  if(f.label.startsWith('Стол')&&f.h>.7){box(x0,z0,x1,z1,f.h-.04,f.h,c);[[x0,z0],[x1-.06,z0],[x0,z1-.06],[x1-.06,z1-.06]].forEach(([a,b])=>box(a,b,a+.06,b+.06,0,f.h-.04,0x5b4a3a));return;}
  box(x0,z0,x1,z1,0,f.h,c,{r:.6});}
M.furn.forEach(fur);

let fly=null;
function goTo(pos,tgt){fly={p0:cam.position.clone(),t0:ctl.target.clone(),p1:pos,t1:tgt,k:0};}
function fitDist(){const t=Math.tan(cam.fov*Math.PI/360);return Math.max((maxy-miny)/2,(maxx-minx)/2/cam.aspect)/t*1.1;}
function setOn(el){document.querySelectorAll('#top button,#rooms button').forEach(b=>{if(b.id!=='blab'&&b.id!=='bwall')b.classList.toggle('on',b===el)});}
function viewAll(){setOn(b3d);const D=fitDist(),dir=new THREE.Vector3(-.4,.78,.48).normalize();goTo(new THREE.Vector3(cx+dir.x*D,dir.y*D,cz+dir.z*D),new THREE.Vector3(cx,0,cz));}
function viewTop(){setOn(btop);goTo(new THREE.Vector3(cx,fitDist()+2.6,cz+.01),new THREE.Vector3(cx,0,cz));}
function viewRoom(r,btn){setOn(btn);const c=new THREE.Vector3(r.x+r.w/2,0,r.y+r.d/2);const t=Math.tan(cam.fov*Math.PI/360),D=Math.max(r.d,r.w/cam.aspect)/2/t*1.7+2.8;
  const dir=new THREE.Vector3(-.35,.86,.38).normalize();goTo(c.clone().add(dir.multiplyScalar(D)),c);}
const b3d=document.getElementById('b3d'),btop=document.getElementById('btop');
b3d.onclick=viewAll; btop.onclick=viewTop;
let low=false;document.getElementById('bwall').onclick=e=>{low=!low;e.target.textContent=low?'Стены выше':'Стены ниже';e.target.classList.toggle('on',low);
  walls.forEach(w=>{if(w.userData.lint){w.visible=!low;return;} if(w.userData.h===H){w.scale.y=low?.4:1;w.position.y=(low?.4*H:H)/2;}});};
let showL=true;const lbl=document.getElementById('lbl');document.getElementById('blab').onclick=e=>{showL=!showL;e.target.classList.toggle('on',showL);lbl.hidden=!showL;};
const rooms=document.getElementById('rooms'),L=[];
const all=document.createElement('button');all.textContent='Вся квартира';all.onclick=viewAll;rooms.appendChild(all);
M.rooms.forEach(r=>{const b=document.createElement('button');b.textContent=r.name;b.onclick=()=>viewRoom(r,b);rooms.appendChild(b);
  const d=document.createElement('div');d.className='t';d.innerHTML=r.name+'<span>'+AREA[r.name]+'</span>';d.onclick=()=>viewRoom(r,b);lbl.appendChild(d);
  L.push([d,new THREE.Vector3(r.x+r.w/2,1.3,r.y+r.d/2)]);});
function home()home();
function resize(){const w=app.clientWidth||innerWidth,h=app.clientHeight||innerHeight;if(!w||!h)return;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();if(!isFinite(cam.position.x))home();}
addEventListener('resize',resize);resize();
home();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, v=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);
  if(fly){fly.k=Math.min(1,fly.k+(reduce?1:.045));const e=1-Math.pow(1-fly.k,3);cam.position.lerpVectors(fly.p0,fly.p1,e);ctl.target.lerpVectors(fly.t0,fly.t1,e);if(fly.k>=1)fly=null;}
  if(!isFinite(cam.position.x)){resize();home();}
  ctl.update();renderer.render(scene,cam);
  const w=app.clientWidth,h=app.clientHeight;
  L.forEach(([d,p])=>{v.copy(p).project(cam);const vis=v.z<1&&Math.abs(v.x)<1.05&&Math.abs(v.y)<1.05;d.hidden=!vis;d.style.left=((v.x+1)/2*w)+'px';d.style.top=((1-v.y)/2*h)+'px';});
})();
