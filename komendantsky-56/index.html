const H = D.house;
const map = L.map('map',{zoomControl:true}).setView(H, 13);

L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
 {maxZoom:19,subdomains:'abc',attribution:'© OpenStreetMap France, © участники OpenStreetMap'}).addTo(map);
L.marker(H,{icon:L.divIcon({className:'',html:'<div class="home">🏠 Наш дом</div>',iconSize:[110,30],iconAnchor:[55,15]}),zIndexOffset:1000})
 .addTo(map).bindPopup(D.extra.popup || 'Наш дом');
const fmt = (p)=> p.min==null ? (p.km.toFixed(1).replace('.',',')+' км по прямой') :
  ((p.mode==='foot'?'🚶 ':'🚗 ')+p.min+' мин · '+String(p.rkm).replace('.',',')+' км');
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b[1]-a[1])*r)*Math.cos(b[0]*r),x=Math.cos(a[0]*r)*Math.sin(b[0]*r)-Math.sin(a[0]*r)*Math.cos(b[0]*r)*Math.cos((b[1]-a[1])*r);return Math.atan2(y,x)/r;}
function arrowTo(a,b,col,dash){
  const line=L.polyline([a,b],{color:col,weight:3,opacity:.85,dashArray:dash||null});
  const t=0.86, tip=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t], ang=bearing(a,b)-90;
  const head=L.marker(tip,{interactive:false,icon:L.divIcon({className:'',html:'<div class="arr" style="color:'+col+';transform:rotate('+ang+'deg)">➤</div>',iconSize:[16,16],iconAnchor:[8,8]})});
  return [line,head];
}
const groups={}, markers=[];
D.pois.forEach((p,i)=>{
  const g = groups[p.cat] || (groups[p.cat]=L.layerGroup().addTo(map));

  g.addLayer(m); markers[i]=m;
  if(p.arrow && p.min!=null){
    arrowTo(H,[p.lat,p.lon],p.col,p.mode==='foot'?'6 6':null).forEach(x=>g.addLayer(x));
    const mid=[H[0]+(p.lat-H[0])*0.55,H[1]+(p.lon-H[1])*0.55];
    g.addLayer(L.marker(mid,{interactive:false,icon:L.divIcon({className:'',html:'<div class="lbl">'+fmt(p)+'</div>',iconSize:null,iconAnchor:[40,10]})}));

order.forEach(c=>{
  const list=D.pois.map((p,i)=>[p,i]).filter(([p])=>p.cat===c);
  if(!list.length) return;
  html+='<div class="grp"><input type="checkbox" checked data-c="'+c+'">'+D.names[c]+'</div>';
  list.forEach(([p,i])=>{html+='<div class="it" data-i="'+i+'"><div class="e">'+p.emo+'</div><div class="t">'+(p.name||p.kind||p.group)+(p.addr?'<div class="s">'+p.addr+'</div>':'')+'</div><div class="r">'+(c==='dom'?'':fmt(p).replace(/^\S+ /,''))+'</div></div>';});
});
near.innerHTML=html;
near.querySelectorAll('.it').forEach(el=>el.onclick=()=>{const p=D.pois[+el.dataset.i];map.flyTo([p.lat,p.lon],15);setTimeout(()=>markers[+el.dataset.i].openPopup(),600);});

D.extra.go.forEach((g,i)=>{

  go.addLayer(m); g._m=m;
  if(g.look) arrowTo(g.pt,g.look,'#E67814','2 6').forEach(x=>go.addLayer(x));

});
document.querySelectorAll('#go [data-g]').forEach(el=>el.onclick=()=>{const g=D.extra.go[+el.dataset.g];if(g.pt){map.flyTo(g.pt,14);setTimeout(()=>g._m.openPopup(),600);}});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===b.dataset.p));});
const all=L.featureGroup(D.pois.filter(p=>p.km<4).map(p=>L.marker([p.lat,p.lon])));all.addLayer(L.marker(H));
map.fitBounds(all.getBounds().pad(0.08));
