const wide=()=>window.matchMedia('(min-width:900px)').matches;
const mapEl=document.getElementById('map');

const dist=k=>k==null?'':(k<1?Math.round(k*100)*10+' м':String(k).replace('.',',')+' км');
const how=p=>(p.mode==='foot'?'🚶 ':'🚗 ')+p.min+' мин';

L.control.zoom({position:'topright'}).addTo(map);

const homeM=L.marker(H,{zIndexOffset:2000,icon:L.divIcon({className:'',html:'<div class="home">🏠 Дом</div>',iconSize:[0,0],iconAnchor:[0,0]})})

const layer=L.layerGroup().addTo(map);
let cur='main', shown=[], selIdx=null;
function pick(key){return D.pois.map((p,i)=>[p,i]).filter(([p])=>key==='main'?p.main:D.chips.find(c=>c[0]===key)[2].includes(p.cat));}
function popup(p){let t='<b>'+p.name+'</b><br>'+p.group;
 if(p.fm!=null&&p.fm<=25) t+='<br>🚶 '+p.fm+' мин'; if(p.cm!=null) t+=(p.fm!=null&&p.fm<=25?' · ':'<br>')+'🚗 '+p.cm+' мин';
 t+=' · '+dist(p.rkm)+(p.addr?'<br><span style="color:#667085">'+p.addr+'</span>':'');return t;}
function draw(key,fit){
 cur=key;layer.clearLayers();shown=[];
 document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===key));
 const items=pick(key);
 items.forEach(([p,i])=>{
  L.polyline([H,[p.lat,p.lon]],{color:p.col,weight:2,opacity:.55,dashArray:p.mode==='foot'?'4 6':null,interactive:false}).addTo(layer);
  const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',iconSize:[0,0],iconAnchor:[0,0],popupAnchor:[0,-14],
   html:'<div class="pt" data-i="'+i+'"><div class="pin" style="border-color:'+p.col+'">'+p.emo+'</div><div class="lb r">'+p.short+' · <b>'+how(p)+'</b></div></div>'})})
   .bindPopup(popup(p)).addTo(layer);
  m.on('click',()=>select(i,false));shown.push({p,i,m});});
 document.getElementById('list').innerHTML=items.map(([p,i])=>'<button class="it" data-i="'+i+'"><span class="e">'+p.emo+'</span><span class="t">'+p.name+
  '<div class="s">'+p.group+(p.addr?' · '+p.addr:'')+'</div></span><span class="r">'+how(p)+'<small>'+dist(p.rkm)+'</small></span></button>').join('');
 document.querySelectorAll('.it').forEach(b=>b.onclick=()=>select(+b.dataset.i,true));
 if(fit){const b=L.latLngBounds([H]);items.forEach(([p])=>b.extend([p.lat,p.lon]));
  map.fitBounds(b,{padding:wide()?[60,60]:[28,28],maxZoom:16,animate:false});}
 selIdx=null;setTimeout(layout,60);
 try{history.replaceState(null,'',key==='main'?location.pathname:'#'+key);}catch(e){}
}
function select(i,fromList){
 selIdx=i;const s=shown.find(x=>x.i===i);if(!s)return;
 document.querySelectorAll('.it').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
 if(fromList){if(!wide()) window.scrollTo({top:0,behavior:'smooth'});
  map.flyTo([s.p.lat,s.p.lon],Math.max(map.getZoom(),15),{duration:.6});setTimeout(()=>s.m.openPopup(),650);}
 setTimeout(layout,700);
}
// подписи: у каждой точки справа или слева; налезает на другую — прячем (видна в списке и по нажатию)
function layout(){
 const R=mapEl.getBoundingClientRect();const boxes=[];
 const hb=document.querySelector('.home');if(hb)boxes.push(hb.getBoundingClientRect());
 const els=shown.map(s=>({s,pt:document.querySelector('.pt[data-i="'+s.i+'"]')})).filter(x=>x.pt);
 els.forEach(x=>{x.pt.classList.toggle('sel',x.s.i===selIdx);x.pin=x.pt.querySelector('.pin').getBoundingClientRect();});
 els.sort((a,b)=>(b.s.i===selIdx)-(a.s.i===selIdx)||a.s.p.km-b.s.p.km);
 els.forEach(x=>{const lb=x.pt.querySelector('.lb');lb.style.visibility='visible';
  for(const side of ['r','l','tr','br','tl','bl','t','b']){lb.className='lb '+side;const r=lb.getBoundingClientRect();
   const bad=r.left<R.left+2||r.right>R.right-46||r.top<R.top+2||r.bottom>R.bottom-14||
    boxes.some(b=>!(r.right<b.left||r.left>b.right||r.bottom<b.top||r.top>b.bottom))||
    els.some(o=>o!==x&&!(r.right<o.pin.left||r.left>o.pin.right||r.bottom<o.pin.top||r.top>o.pin.bottom));
   if(!bad){boxes.push(r);return;}}
  lb.style.visibility='hidden';});
}
map.on('zoomend moveend',()=>setTimeout(layout,30));
window.addEventListener('resize',()=>setTimeout(layout,100));
document.getElementById('chips').innerHTML=D.chips.map(c=>'<button class="chip" data-k="'+c[0]+'">'+c[1]+'</button>').join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{draw(b.dataset.k,true);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});});
const start=(location.hash||'').slice(1);
draw(D.chips.some(c=>c[0]===start)?start:'main',true);
