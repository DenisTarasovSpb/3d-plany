<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>12 ЖК Москвы для бюджета 30–50 млн ₽</title>
<meta property="og:title" content="12 ЖК Москвы для бюджета 30–50 млн ₽">
<meta property="og:description" content="Сравнили по четырём параметрам и сроку сдачи. Вверху — тройка по итогам сравнения, ниже — остальные по порядку.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#294D9D;--blue2:#3D59A5;--ink:#2B2B2B;--muted:#7E8794;--line:#D8DEEC;--fill:#E7EBF4;
  --bg:#F3F5FA;--card:#fff;--hot:#EEF2FB;
  --l5:#1E9E6A;--l4:#5DB46C;--l3:#E3A21A;--l2:#EA7B2E;--l1:#D9483B;--na:#C3C9D6;
  --r:18px;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#4A6BC0 0%,var(--blue) 45%,#1F3C80 100%);color:#fff;padding:18px 0 24px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:38px solid rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.06em;font-size:13px;text-transform:uppercase;opacity:.95}
.brand i{width:24px;height:24px;border-radius:7px;background:#fff;display:inline-block;position:relative}
.brand i:before{content:"";position:absolute;inset:6px;border-radius:3px;background:var(--blue)}
.eyebrow{margin-top:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C9D3EC;font-weight:700}
h1{margin:6px 0 8px;font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-.01em;max-width:680px}
.lead{margin:0;color:#DCE3F4;max-width:620px;font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.meta span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600}
/* sections */
section{margin-top:20px}
h2{font-size:19px;margin:0 0 10px;font-weight:800;letter-spacing:-.005em}
h2 small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;letter-spacing:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* chips */
.q{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.q b{font-size:14px;font-weight:800}
.reset{border:0;background:none;color:var(--blue);font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px;visibility:hidden}
.reset.on{visibility:visible}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:8px 0 2px}
.chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;padding:7px 12px;border-radius:99px;font-weight:700;font-size:13.5px;cursor:pointer;transition:all .18s;white-space:nowrap}
.chip:hover{border-color:var(--blue2)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(41,77,157,.28)}
.chip em{font-style:normal;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);padding:1px 6px;border-radius:99px;display:none}
.chip[aria-pressed="true"] em{display:inline}
/* podium */
.pod{display:grid;gap:10px;margin-top:12px}
.pcol{display:flex;flex-direction:column;min-width:0}
.pc{display:grid;grid-template-columns:34px 1fr auto;column-gap:10px;row-gap:3px;align-items:start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(41,77,157,.12)}
.pc.open{border-color:var(--blue2);box-shadow:0 0 0 2px rgba(61,89,165,.25)}
.p1 .pc{background:linear-gradient(160deg,#FFF6DC,#fff 62%);border-color:#EFD592}
.medal{grid-column:1;grid-row:1/span 2;font-size:28px;line-height:1}
.pn1{grid-column:2;grid-row:1;font-weight:800;font-size:17px;line-height:1.2}
.ptot{grid-column:3;grid-row:1/span 2;text-align:right}
.ptot b{display:block;font-size:26px;line-height:1;font-weight:800}
.ptot small{font-size:10.5px;color:var(--muted);font-weight:700}
.psub{grid-column:2;grid-row:2;font-size:12.5px;color:var(--muted);line-height:1.3}
.why{grid-column:1/-1;grid-row:3;font-size:13.5px;line-height:1.35;margin-top:6px;color:#3A4354}
.why:before{content:"Почему: ";font-weight:800;color:var(--blue)}
.mini{grid-column:1/3;grid-row:4;display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:7px}
.mi{display:inline-flex;align-items:center;gap:3px;font-size:13px}
.mi i{width:11px;height:11px;border-radius:50%;display:inline-block}
.more{grid-column:3;grid-row:4;align-self:end;font-size:12.5px;font-weight:800;color:var(--blue);white-space:nowrap}
.step{display:none}
.g1{color:var(--l5)}.g2{color:#3E9F57}.g3{color:#C98A0A}.g4{color:#D2661C}.g5{color:var(--l1)}
i.l5{background:var(--l5)}i.l4{background:var(--l4)}i.l3{background:var(--l3)}i.l2{background:var(--l2)}i.l1{background:var(--l1)}i.nd{background:#fff;border:2px solid var(--na)}
/* slot under podium */
.slot{margin-top:10px;background:#fff;border:1.5px solid var(--blue2);border-radius:var(--r);padding:14px 16px}
.slot[hidden]{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh b{font-size:17px;font-weight:800}
.x{border:0;background:var(--fill);border-radius:99px;padding:5px 12px;font-weight:800;font-size:12.5px;color:var(--blue);cursor:pointer}
/* rows */
.lh,.rh{display:grid;grid-template-columns:26px minmax(0,1fr) auto 40px 14px;align-items:center;column-gap:9px}
.lh{padding:0 14px 6px;font-size:11.5px;color:var(--muted);font-weight:700}
.lh .md4{gap:5px}
.lh .md4 span{width:15px;text-align:center;font-size:13px;line-height:1}
.lh .it{text-align:right}
.rows{display:grid;gap:8px}
.row{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:12px}
.row.open{border-color:var(--blue2)}
.rh{width:100%;border:0;background:none;padding:12px 14px;cursor:pointer;text-align:left}
.rh:hover{background:#FAFBFE}
.rn{width:26px;height:26px;border-radius:50%;background:var(--fill);color:var(--blue);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.rt{min-width:0}
.rt b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.rt small{display:block;font-size:12px;color:var(--muted);line-height:1.3;margin-top:1px}
.md4{display:inline-flex;gap:5px}
.md4 i{width:15px;height:15px;border-radius:50%;display:inline-block}
.rs{font-weight:800;font-size:18px;text-align:right}
.chev{width:9px;height:9px;border-right:2px solid #9AA4B8;border-bottom:2px solid #9AA4B8;transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.row.open .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.rd{padding:0 14px 14px;border-top:1px dashed var(--line)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:#525C6E;margin:10px 2px 0}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* details */
.dsub{font-size:12.5px;color:var(--muted);margin:10px 0 2px;line-height:1.4}
.prms{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.prm{display:flex;gap:10px;padding:7px 6px;border-radius:12px}
.prm.hot{background:var(--hot)}
.prm .pi{font-size:17px;line-height:1.3;flex:0 0 22px;text-align:center}
.pb{flex:1;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pn{font-weight:700;font-size:13.5px}
.prm.hot .pn{color:var(--blue)}
.sc5{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:#E3E7EF}
.dots.l5{color:var(--l5)}.dots.l4{color:var(--l4)}.dots.l3{color:var(--l3)}.dots.l2{color:var(--l2)}.dots.l1{color:var(--l1)}
.dots i.on{background:currentColor}
.dots i.half{background:linear-gradient(90deg,currentColor 50%,#E3E7EF 50%)}
.sc5 b{font-size:12px;font-weight:800;color:#525C6E;min-width:18px;text-align:right}
.na{font-size:11px;color:var(--muted);font-weight:700;background:#F0F2F6;border-radius:99px;padding:1px 8px;white-space:nowrap}
.pf{font-size:13px;color:#525C6E;margin-top:2px;line-height:1.4}
.prm.price{border:1px dashed var(--line);margin-top:4px}
.pm{display:grid;gap:10px;margin-top:10px}
.pm h4{margin:0 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.pm .p h4{color:var(--l5)}.pm .m h4{color:#C2551B}
.pm ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.pm li{font-size:13.5px;padding-left:22px;position:relative;line-height:1.35}
.pm li:before{position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pm .p li:before{content:"✓";background:#DDF3E7;color:#137A50}
.pm .m li:before{content:"!";background:#FDE8DC;color:#C2551B}
.cf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.promo{font-size:13px;font-weight:700;background:#FFF6DF;color:#7A5300;border-radius:10px;padding:6px 10px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;transition:background .15s}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--blue2);background:#fff}
/* map */
.map svg{width:100%;height:auto;display:block}
.map .ring{fill:none;stroke:#C7D0E4;stroke-width:1.2;stroke-dasharray:3 4}
.map .rl{font-size:10px;fill:#9AA4B8;font-weight:700}
.map .dot{cursor:pointer}
.map .dot circle.b{stroke:#fff;stroke-width:2.5;transition:r .2s}
.map .dot text{font-size:11.5px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map .dot:hover circle.b{r:14}
.map .lead-line{stroke:#9AA4B8;stroke-width:1}
.map .true{fill:#5B667C}
.map .ctr{fill:var(--blue)}
.map .ctl{font-size:10.5px;font-weight:800;fill:var(--blue)}
.map .nsw{font-size:10px;font-weight:800;fill:#9AA4B8}
.maphint{font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.maphint i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
/* how */
details.how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
details.how summary{cursor:pointer;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary:after{content:"＋";color:var(--blue);font-weight:800}
details.how[open] summary:after{content:"－"}
.hw{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.hw li{display:flex;gap:10px;font-size:14px}
.hw li span{flex:0 0 22px;text-align:center}
/* cta */
.cta{background:linear-gradient(135deg,var(--blue),#1F3C80);color:#fff;border-radius:22px;padding:22px 18px;position:relative;overflow:hidden}
.cta:after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:30px solid rgba(255,255,255,.07)}
.cta h2{color:#fff;margin-bottom:6px}
.cta p{margin:0 0 16px;color:#DCE3F4;max-width:520px}
.cta .btn{background:#fff;color:var(--blue)}
.cta .note{display:block;margin-top:10px;font-size:12px;color:#BFCBEA}
footer{margin:22px 0 40px;font-size:12px;color:var(--muted);line-height:1.5}
footer p{margin:0 0 6px}
@media (min-width:760px){
  h1{font-size:36px;max-width:900px}
  .hero{padding:24px 0 32px}
  .pod{grid-template-columns:repeat(3,1fr);align-items:end;gap:14px}
  .pcol.p1{order:2}.pcol.p2{order:1}.pcol.p3{order:3}
  .pc{grid-template-columns:34px 1fr auto;grid-template-rows:auto auto auto 1fr auto;min-height:238px;border-radius:16px 16px 0 0;padding:14px}
  .p1 .pc{min-height:262px}
  .medal{grid-row:1;font-size:30px}
  .ptot{grid-row:1}
  .pn1{grid-column:1/-1;grid-row:2;margin-top:8px;font-size:18px}
  .psub{grid-column:1/-1;grid-row:3}
  .why{grid-row:4;align-self:start}
  .mini{grid-row:5}
  .more{grid-row:5}
  .step{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;border-radius:0 0 14px 14px}
  .p1 .step{height:54px;background:linear-gradient(#F6C445,#E09A12)}
  .p2 .step{height:36px;background:linear-gradient(#C9CFDA,#98A1B3)}
  .p3 .step{height:22px;background:linear-gradient(#E2A878,#B8723F);font-size:14px}
  .pm{grid-template-columns:1fr 1fr}
  .slot .prms{grid-template-columns:1fr 1fr;column-gap:14px}
  .cta{padding:28px}
}
@media (min-width:980px){
  .cols{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:24px;align-items:start}
  .mapcol{position:sticky;top:16px;margin-top:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="brand"><i></i><span id="brand"></span></div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
    <div class="meta" id="meta"></div>
  </div>
</header>

<main class="wrap">
  <section>
    <h2 id="podh">Тройка по итогам сравнения<small id="podhs"></small></h2>
    <div class="q"><b>Что для вас важнее? Тройка и список перестроятся</b><button class="reset" id="reset" type="button">Сбросить</button></div>
    <div class="chips" id="chips"></div>
    <div class="pod" id="pod"></div>
    <div class="slot" id="slot" hidden></div>
  </section>

  <div class="cols">
    <section>
      <h2 id="listh">Остальные по порядку<small>нажмите на строку — откроются подробности</small></h2>
      <div class="lh" id="lh"></div>
      <div class="rows" id="rows"></div>
      <div class="lgd" id="lgd"></div>
    </section>
    <section class="mapcol">
      <h2>Где находятся<small>цифра — место в подборке, нажмите, чтобы открыть</small></h2>
      <div class="panel map" id="map"></div>
    </section>
  </div>

  <section>
    <details class="how" id="how">
      <summary>Как мы считали</summary>
      <ul class="hw" id="hw"></ul>
    </details>
  </section>

  <section id="contact">
    <div class="cta">
      <h2 id="ctat"></h2>
      <p id="ctap"></p>
      <a class="btn" id="ctab" href="#contact"></a>
      <span class="note" id="ctan"></span>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

      <span class="ptot ${lvT(o.t)}"><b>${fmt(o.t)}</b><small>из 5</small></span>
      <span class="psub">${esc(it.area)} · сдача: ${esc(it.sdacha)}</span>
      <span class="why">${esc(it.why)}</span>${mini(it)}
      <span class="more">${op ? 'Скрыть ▴' : 'Подробнее ▾'}</span></button><div class="step">${i + 1}</div></div>`; }).join('');
  const ot = top.findIndex(o => o.it.id === openId);
  if (ot >= 0) {
    const it = top[ot].it;
    $('slot').innerHTML = `<div class="sh"><b>${MEDAL[ot]} ${esc(it.name)} — подробно</b><button class="x" type="button">Скрыть</button></div>${details(it)}`;
    $('slot').hidden = false;
  } else { $('slot').hidden = true; $('slot').innerHTML = ''; }
  $('rows').innerHTML = rest.map((o, j) => { const it = o.it, op = openId === it.id;
    return `<div class="row${op ? ' open' : ''}" id="r-${it.id}"><button class="rh" type="button" data-id="${it.id}" aria-expanded="${op}">
      <span class="rn">${j + 4}</span><span class="rt"><b>${esc(it.name)}</b><small>${esc(it.area)} · ${esc(it.sdacha)}</small></span>
      ${md4(it)}<span class="rs ${lvT(o.t)}">${fmt(o.t)}</span><span class="chev" aria-hidden="true"></span></button>
      ${op ? `<div class="rd">${details(it)}</div>` : ''}</div>`; }).join('');
  $('listh').firstChild.textContent = `Остальные ${rest.length} по порядку`;
  const names = P.filter(p => active.has(p.key)).map(p => p.short.toLowerCase());
  $('podhs').textContent = names.length ? `важнее всего: ${names.join(', ')} — с двойным весом` : 'нажмите на карточку — откроются подробности';
  $('reset').classList.toggle('on', active.size > 0);
  if (user && !reduce) [$('pod'), $('rows')].forEach(el => el.animate([{opacity: .35}, {opacity: 1}], {duration: 320, easing: 'ease-out'}));
  const rk = new Map(list.map((o, i) => [o.it.id, [i + 1, o.t]]));
  mapDots.forEach((g, id) => {
    const v = rk.get(id);
    g.querySelector('text').textContent = v[0];
    g.querySelector('circle.b').setAttribute('fill', COLT[lvT(v[1])]);
  });
}
update(false);
</script>
</body>
</html>
